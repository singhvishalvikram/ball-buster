<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ball Buster</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <div class="brand">Ball Buster</div>
        <div class="stats">
          <span id="score">Score: 0</span>
          <span id="best">Best: 0</span>
        </div>
      </div>
      <canvas id="game" width="960" height="540" aria-label="Ball Buster game area"></canvas>
      <div class="help">Move: A / D or mouse • Launch: Space / click</div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
